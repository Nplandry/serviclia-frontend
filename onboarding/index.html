<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bienvenida a ServicIA. Cuéntanos un poco sobre ti.">
  <meta name="theme-color" content="#0f4c81">
  <title>ServicIA - Bienvenida</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230f4c81'/%3E%3Ctext x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='Arial'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="onboarding">
    <div class="onboarding__shell">
      <header class="onboarding__header">
        <div class="onboarding__brand">
          <span class="brand__mark">S</span>
          <span class="onboarding__brand-name">ServicIA</span>
        </div>
        <div id="progress" class="onboarding__progress" aria-hidden="true"></div>
      </header>

      <div id="deck" class="onboarding__deck" aria-live="polite"></div>

      <footer class="onboarding__footer">
        <button id="prevBtn" class="onboarding__nav" type="button" hidden>Atrás</button>
        <p id="stepStatus" class="onboarding__status" aria-live="polite"></p>
      </footer>
    </div>
  </main>

  <script src="../js/core/auth.js">
</script>
  <script src="../js/onboarding.js">
</script>
</body>
</html>
